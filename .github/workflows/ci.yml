name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  BUILD_PATH: '.'

jobs:
  branch-name-check:
    name: Branch name check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^dependabot/ ]]; then
            echo "Dependabot branch, skipping check: $HEAD_REF"
            exit 0
          fi
          if [[ ! "$HEAD_REF" =~ ^(feat|fix|docs|chore|refactor|test|ci)/[a-z0-9._-]+$ ]]; then
            echo "::error::ブランチ名 '$HEAD_REF' が命名規則に従っていません。<type>/<kebab-case-description> の形式にしてください（type: feat, fix, docs, chore, refactor, test, ci）。詳細は CONTRIBUTING.md を参照してください。"
            exit 1
          fi
          echo "Branch name '$HEAD_REF' is valid."

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ${{ env.BUILD_PATH }}/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.BUILD_PATH }}
      - name: Lint
        run: pnpm run lint
        working-directory: ${{ env.BUILD_PATH }}
      - name: Format check
        run: pnpm run format:check
        working-directory: ${{ env.BUILD_PATH }}
      - name: Type check
        run: pnpm run check
        working-directory: ${{ env.BUILD_PATH }}
      - name: Test
        run: pnpm run test
        working-directory: ${{ env.BUILD_PATH }}
      - name: Build
        run: pnpm run build
        working-directory: ${{ env.BUILD_PATH }}
